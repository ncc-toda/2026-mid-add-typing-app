<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pattern B · 統計</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="mnav">
    <span>B Arcade HUD</span>
    <span class="sep">/</span>
    <a href="title.html">タイトル</a>
    <a href="difficulty.html">難易度</a>
    <a href="play.html">プレイ</a>
    <a href="result.html">結果</a>
    <a class="is-current" href="stats.html">統計</a>
    <a class="hub" href="../index.html">比較ハブ</a>
  </nav>
  <div class="screen">
    <div class="panel">
      <div class="stamp">YOUR WEAK SPOTS</div>
      <h1>統計</h1>
      <p class="tag">累計 12 プレイ</p>
      <h2 style="font-size:16px;margin:20px 0 8px">苦手な指</h2>
      <div class="fingers">
        <div class="finger">左小指 2.1%</div>
        <div class="finger">左薬指 3.4%</div>
        <div class="finger">左中指 4.0%</div>
        <div class="finger bad">左人差 11.2%</div>
        <div class="finger">右人差 5.8%</div>
        <div class="finger">右中指 4.4%</div>
        <div class="finger bad">右薬指 9.6%</div>
        <div class="finger">右小指 6.1%</div>
        <div class="finger">親指 1.2%</div>
      </div>
      <div class="cols">
        <div>
          <h2 style="font-size:16px">苦手キー</h2>
          <table class="table">
            <thead><tr><th>キー</th><th>入力</th><th>ミス</th><th>率</th></tr></thead>
            <tbody>
              <tr><td>y</td><td>86</td><td>14</td><td>16.3%</td></tr>
              <tr><td>,</td><td>41</td><td>6</td><td>14.6%</td></tr>
              <tr><td>p</td><td>22</td><td>3</td><td>13.6%</td></tr>
              <tr><td>@</td><td>18</td><td>2</td><td>11.1%</td></tr>
            </tbody>
          </table>
        </div>
        <div>
          <h2 style="font-size:16px">苦手な動き</h2>
          <table class="table">
            <thead><tr><th>遷移</th><th>回数</th><th>率</th></tr></thead>
            <tbody>
              <tr><td>k → y</td><td>40</td><td>22.5%</td></tr>
              <tr><td>Shift → 2</td><td>18</td><td>16.7%</td></tr>
              <tr><td>l → ,</td><td>24</td><td>12.5%</td></tr>
              <tr><td>n → n</td><td>31</td><td>9.7%</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="actions">
        <a class="btn btn-primary" href="title.html">タイトルへ</a>
        <a class="btn btn-ghost" href="#">リセット</a>
      </div>
    </div>
  </div>
</body>
</html>
