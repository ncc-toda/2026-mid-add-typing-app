<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pattern B · プレイ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="mnav">
    <span>B Arcade HUD</span>
    <span class="sep">/</span>
    <a href="title.html">タイトル</a>
    <a href="difficulty.html">難易度</a>
    <a class="is-current" href="play.html">プレイ</a>
    <a href="result.html">結果</a>
    <a href="stats.html">統計</a>
    <a class="hub" href="../index.html">比較ハブ</a>
  </nav>

  <header class="hud">
    <div class="hud-block">
      <div class="k">オオダ · 新米</div>
      <div style="font-size:18px;font-weight:700;margin-top:4px">返信 1 / combo</div>
      <span class="combo-pill">18 HIT</span>
    </div>
    <div class="hud-block pay">
      <div class="k">ゲーム内年収</div>
      <div class="v">32<small>万</small></div>
    </div>
    <div class="hud-block time">
      <div class="k">残り</div>
      <div class="v">0:37</div>
    </div>
  </header>

  <div class="stage">
    <div class="channel-chip"><span class="dot"></span> #incident に投稿中</div>
    <div class="chat">
      <div class="row">
        <div class="av" style="background:#c4b5fd">サ</div>
        <div>
          <div style="font-size:12px;font-weight:700;margin-bottom:4px">サトウ</div>
          <div class="bubble">PR #12 のレビューお願いできますか？</div>
        </div>
      </div>
      <div class="row me">
        <div class="av" style="background:#fb7185">オ</div>
        <div style="text-align:right">
          <div style="font-size:12px;font-weight:700;margin-bottom:4px">オオダ</div>
          <div class="bubble">確認します。少々お待ちください。</div>
          <span class="gain">昇給 +32万</span>
        </div>
      </div>
      <div class="row">
        <div class="av" style="background:#67e8f9">タ</div>
        <div>
          <div style="font-size:12px;font-weight:700;margin-bottom:4px">タナカ</div>
          <div class="bubble">ログインボタン押しても反応ないです</div>
        </div>
      </div>
    </div>

    <div class="keyboard-stage">
      <div class="k" style="color:#fde047">いま打つ返信</div>
      <div class="target">
        <span class="done">再現します。一旦</span><span class="cur">リ</span><span class="rest">サーチします…（5分）</span>
      </div>
      <div class="romaji">ri　← ローマ字でここまで</div>
      <div class="hint">全文一致で自動送信 · ミスするとコンボ消滅</div>
    </div>
  </div>
</body>
</html>
