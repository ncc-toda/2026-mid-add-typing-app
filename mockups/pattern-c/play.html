<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="mnav">
    <span>C Colorful DM</span>
    <span class="sep">/</span>
    <a href="title.html">タイトル</a>
    <a href="difficulty.html">難易度</a>
    <a class="is-current" href="play.html">プレイ</a>
    <a href="result.html">結果</a>
    <a href="stats.html">統計</a>
    <a class="hub" href="../index.html">比較ハブ</a>
  </nav>

  <div class="shell">
    <header class="dm-head">
      <div class="av" style="background:#8b5cf6">タ</div>
      <div>
        <h1>タナカ</h1>
        <p>#incident · オンライン</p>
      </div>
      <div class="status-chips">
        <span class="chip pay">年収 32万</span>
        <span class="chip time">0:37</span>
        <span class="chip combo">combo 18</span>
      </div>
    </header>

    <div class="thread">
      <div class="msg them">
        <div class="av" style="background:#8b5cf6">サ</div>
        <div>
          <div class="name">サトウ</div>
          <div class="b">PR #12 のレビューお願いできますか？</div>
        </div>
      </div>
      <div class="msg me">
        <div class="av" style="background:#fb7185">オ</div>
        <div>
          <div class="name" style="text-align:right">オオダ</div>
          <div class="b">確認します。少々お待ちください。</div>
          <div class="pay">+32万 昇給</div>
        </div>
      </div>
      <div class="msg them">
        <div class="av" style="background:#0ea5e9">タ</div>
        <div>
          <div class="name">タナカ</div>
          <div class="b">ログインボタン押しても反応ないです</div>
        </div>
      </div>
    </div>

    <div class="dock">
      <div class="dock-box">
        <div class="target">
          <span class="done">再現します。一旦</span><span class="cur">リ</span><span class="rest">サーチします…（5分）</span>
        </div>
        <div class="romaji">打つキー <b>ri</b> · ミスすると進まない · 自動送信</div>
      </div>
    </div>
  </div>
</body>
</html>
